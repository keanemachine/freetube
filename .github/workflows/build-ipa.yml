name: Build unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version and schemes
        run: |
          xcodebuild -version
          xcodebuild -list -project FreeTube/FreeTube.xcodeproj

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project FreeTube/FreeTube.xcodeproj \
            -scheme FreeTube \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FreeTube.app Payload/
          zip -qry FreeTube.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: FreeTube-ipa
          path: FreeTube.ipa
